name: ci
on: { push: { branches: [main] }, pull_request: { branches: [main] } }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp envs/.env.dev.example envs/.env.dev
      - name: Lint compose
        run: docker compose config -q && echo "compose ok"
      - name: Verify env sync
        run: test -f envs/.env.dev.example && echo "env ok"
      - name: Check init.sql
        run: test -f docker/postgres/init.sql && grep -q "job_platform_auth" docker/postgres/init.sql
      - name: Validate Grafana dashboards
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = sorted(glob.glob('docker/grafana/dashboards/*.json'))
          if not files:
              sys.exit('no dashboard JSON files found')
          for f in files:
              with open(f) as fh:
                  doc = json.load(fh)
              panels = [p for p in doc.get('panels', []) if p.get('type') != 'row']
              if not panels:
                  sys.exit(f'{f}: no data panels')
              for p in panels:
                  exprs = [t.get('expr') for t in p.get('targets', [])]
                  if not exprs or not all(exprs):
                      sys.exit(f'{f}: panel {p.get("title")!r} has no query')
              print(f'ok {f}: {len(panels)} panels')
          PY
      - name: Guard against stale runtime metric names
        run: |
          if grep -rn "process_runtime_dotnet" docker/grafana docs README.md; then
            echo "stale metric names found (use the dotnet_* names from System.Runtime)" >&2
            exit 1
          fi
          echo "metric names ok"
