name: ci
on: { push: { branches: [main] }, pull_request: { branches: [main] } }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp envs/.env.dev.example envs/.env.dev
      - name: Lint compose
        run: docker compose config -q && echo "compose ok"
      - name: Verify env sync
        run: test -f envs/.env.dev.example && echo "env ok"
      - name: Check init.sql
        run: test -f docker/postgres/init.sql && grep -q "job_platform_auth" docker/postgres/init.sql
