# job-platform-infra/docker-compose.yml — see README.md
name: job-platform

# Shared by the .NET services built from source below. They run inside the compose network, so
# Kafka/Redis/ES are reached by service name (envs/.env.dev points at localhost for host-run
# services). One JWT secret for every service: auth-svc, the gateway, job-svc and app-svc bind the
# Jwt section (Jwt__* env vars); profile-svc and ai-svc read JWT_SECRET.
# App images build from .build/src (scripts/fetch-sources.ps1|sh: clean clones of one ref, gitignored).
# Set SERVICES_SRC=.. to build from the sibling working trees instead.

x-dev-dotnet-env: &dev-dotnet-env
  ASPNETCORE_ENVIRONMENT: Development
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32chars-min}
  JWT_ISSUER: ${JWT_ISSUER:-job-platform}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-job-platform}
  Jwt__Secret: ${JWT_SECRET:-dev-jwt-secret-change-me-32chars-min}
  Jwt__Issuer: ${JWT_ISSUER:-job-platform}
  Jwt__Audience: ${JWT_AUDIENCE:-job-platform}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_URL: redis:6379
  ELASTICSEARCH_URL: http://elasticsearch:9200

# .NET runtime images may lack curl (profile-svc): probe /health over /dev/tcp, a bash feature.
# Run it with bash explicitly: CMD-SHELL uses /bin/sh, which is dash in these Debian images.
x-dev-dotnet-health: &dev-dotnet-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    container_name: job-platform-postgres
    restart: unless-stopped
    env_file:
      - envs/.env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-job_platform}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-job_platform}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [job-platform]

  redis:
    image: redis:7-alpine
    container_name: job-platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [job-platform]

  elasticsearch:
    # Custom image: adds analysis-icu (vietnamese_icu analyzer for search-svc W6).
    # Build once: docker compose build elasticsearch (up alone reuses the old image tag).
    build:
      context: ./docker/es
    image: job-platform-elasticsearch:8.13.2-icu
    container_name: job-platform-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=job-platform
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [job-platform]

  kafka:
    # bitnami/kafka was removed from Docker Hub (404). Use the official Apache image.
    image: apache/kafka:3.7.0
    container_name: job-platform-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    env_file:
      - envs/.env.dev
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - CLUSTER_ID=job-platform-kraft-cluster
      # Dual listeners: PLAINTEXT (9092) for host-run .NET services, INTERNAL
      # (29092, advertised as kafka:29092) for in-network clients such as kafka-ui.
      - KAFKA_LISTENERS=PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [job-platform]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: job-platform-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    networks: [job-platform]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: job-platform-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [job-platform]

  # ── App Services (PBL6-16 E2E auth via gateway) ──
  auth:
    build:
      context: ${SERVICES_SRC:-./.build/src}/job-platform-auth-svc
      dockerfile: Dockerfile
    container_name: job-platform-auth
    restart: unless-stopped
    env_file:
      - envs/.env.dev
    environment:
      <<: *dev-dotnet-env
      ASPNETCORE_URLS: http://+:5001
      # Override Host for Docker bridge DNS (workaround: localhost outside compose)
      DATABASE_URL_AUTH: Host=postgres;Port=5432;Database=job_platform_auth;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__AuthDb: Host=postgres;Port=5432;Database=job_platform_auth;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks: [job-platform]

  # job-svc reads ConnectionStrings:JobDb before DATABASE_URL_JOB: set both.
  job:
    build:
      context: ${SERVICES_SRC:-./.build/src}/job-platform-job-svc
      dockerfile: Dockerfile
    container_name: job-platform-job
    restart: unless-stopped
    env_file:
      - envs/.env.dev
    environment:
      <<: *dev-dotnet-env
      ASPNETCORE_URLS: http://+:5002
      DATABASE_URL_JOB: Host=postgres;Port=5432;Database=job_platform_job;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__JobDb: Host=postgres;Port=5432;Database=job_platform_job;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      SEARCH_SYNC_URL: http://search:5003
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *dev-dotnet-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5002 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
    networks: [job-platform]

  # No SEARCH_INDEX_TOKEN: POST /api/search/index stays open (local dev only, warned at startup).
  search:
    build:
      context: ${SERVICES_SRC:-./.build/src}/job-platform-search-svc
      dockerfile: Dockerfile
    container_name: job-platform-search
    restart: unless-stopped
    env_file:
      - envs/.env.dev
    environment:
      <<: *dev-dotnet-env
      ASPNETCORE_URLS: http://+:5003
      SEARCH_ES_URL: http://elasticsearch:9200
      SEARCH_REDIS_URL: redis:6379
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-jobs}
      JOB_SERVICE_URL: http://job:5002
    ports:
      - "5003:5003"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *dev-dotnet-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5003 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
    networks: [job-platform]

  app:
    build:
      context: ${SERVICES_SRC:-./.build/src}/job-platform-app-svc
      dockerfile: Dockerfile
    container_name: job-platform-app
    restart: unless-stopped
    env_file:
      - envs/.env.dev
    environment:
      <<: *dev-dotnet-env
      ASPNETCORE_URLS: http://+:5004
      DATABASE_URL_APP: Host=postgres;Port=5432;Database=job_platform_app;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__AppDb: Host=postgres;Port=5432;Database=job_platform_app;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      JOB_SERVICE_URL: http://job:5002
      COMPANY_SERVICE_URL: http://job:5002
      APP_CV_STORAGE_PATH: /data/cv
    volumes:
      - cv_data:/data/cv
    ports:
      - "5004:5004"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *dev-dotnet-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5004 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
    networks: [job-platform]

  # No PROFILE_ENCRYPTION_KEY: Development uses profile-svc's insecure dev key (logged as a warning).
  profile:
    build:
      context: ${SERVICES_SRC:-./.build/src}/job-platform-profile-svc
      dockerfile: Dockerfile
    container_name: job-platform-profile
    restart: unless-stopped
    env_file:
      - envs/.env.dev
    environment:
      <<: *dev-dotnet-env
      ASPNETCORE_URLS: http://+:5005
      DATABASE_URL_PROFILE: Host=postgres;Port=5432;Database=job_platform_profile;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__ProfileDb: Host=postgres;Port=5432;Database=job_platform_profile;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *dev-dotnet-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5005 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
    networks: [job-platform]

  # Mail goes to MailHog: http://localhost:8025
  notif:
    build:
      context: ${SERVICES_SRC:-./.build/src}/job-platform-notif-svc
      dockerfile: Dockerfile
    container_name: job-platform-notif
    restart: unless-stopped
    env_file:
      - envs/.env.dev
    environment:
      <<: *dev-dotnet-env
      ASPNETCORE_URLS: http://+:5006
      DATABASE_URL_NOTIF: Host=postgres;Port=5432;Database=job_platform_notif;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__NotifDb: Host=postgres;Port=5432;Database=job_platform_notif;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    ports:
      - "5006:5006"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *dev-dotnet-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5006 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
    networks: [job-platform]

  # ai-svc (Python): resume scoring behind /api/ai/*. The image downloads its ONNX model at build time.
  # It checks the auth-svc JWT itself (JWT_SECRET). Uses the image's own HEALTHCHECK (curl /health).
  ai:
    build:
      context: ${SERVICES_SRC:-./.build/src}/job-platform-ai-svc
      dockerfile: Dockerfile
    container_name: job-platform-ai
    restart: unless-stopped
    environment:
      PORT: "6000"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32chars-min}
      JWT_ISSUER: ${JWT_ISSUER:-job-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-job-platform}
      JOB_SERVICE_URL: http://job:5002
    ports:
      - "6000:6000"
    networks: [job-platform]

  gateway:
    build:
      context: ${SERVICES_SRC:-./.build/src}/job-platform-gateway
      dockerfile: Dockerfile
    container_name: job-platform-gateway
    restart: unless-stopped
    env_file:
      - envs/.env.dev
    environment:
      <<: *dev-dotnet-env
      ASPNETCORE_URLS: http://+:5000
      # Every service runs in this compose file. To debug one as a local `dotnet run` process instead,
      # stop its container and point its upstream at http://host.docker.internal:<port>.
      GATEWAY_UPSTREAM_AUTH: http://auth:5001
      GATEWAY_UPSTREAM_JOB: http://job:5002
      GATEWAY_UPSTREAM_SEARCH: http://search:5003
      GATEWAY_UPSTREAM_APP: http://app:5004
      GATEWAY_UPSTREAM_PROFILE: http://profile:5005
      GATEWAY_UPSTREAM_NOTIF: http://notif:5006
      GATEWAY_UPSTREAM_AI: http://ai:6000
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,https://job-platform-web.vercel.app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    depends_on:
      auth:
        condition: service_healthy
      job:
        condition: service_healthy
      search:
        condition: service_healthy
      app:
        condition: service_healthy
      profile:
        condition: service_healthy
      notif:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [job-platform]

  web:
    build:
      context: ${SERVICES_SRC:-./.build/src}/job-platform-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: job-platform-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks: [job-platform]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: job-platform-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [job-platform]

  grafana:
    image: grafana/grafana:11.2.2
    container_name: job-platform-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [job-platform]

volumes:
  pg_data:
  redis_data:
  es_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  cv_data:

networks:
  job-platform:
    driver: bridge
